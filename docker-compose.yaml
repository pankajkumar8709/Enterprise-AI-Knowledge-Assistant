services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: enterprise_ai_ka
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d enterprise_ai_ka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
